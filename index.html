<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Circular Button Hover Effect with HTML &amp; CSS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<section class="container content-bg-heart">
  <button
    type="button"
    class="heart-button"
    aria-label="Like"
    aria-pressed="false"
  >
    <span class="heart-button-back" aria-hidden="true">
      <span class="heart-button-back-inner"></span>
    </span>

    <span class="heart-button-label" aria-hidden="true">
      &hearts;
    </span>
  </button>
</section>
</body>
</html>
